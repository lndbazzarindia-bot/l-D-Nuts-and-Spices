<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — L&amp;D Nuts &amp; Spices</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/jpeg" href="/assets/img/logo.jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <div id="loading-screen" class="loading-screen">
    <div class="spinner" aria-hidden="true"></div>
  </div>

  <div id="login-screen" class="screen" hidden>
    <div class="login-wrap">
      <h1 class="display-title">Admin Login</h1>
      <p class="subtitle">Update product prices and images</p>
      <form id="login-form" class="login-form">
        <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
        <p id="login-error" class="form-error" hidden></p>
        <button type="submit" class="btn btn-dark btn-block">Sign in</button>
      </form>
      <a href="/" class="back-link">← Back to website</a>
    </div>
  </div>

  <div id="admin-screen" class="screen" hidden>
    <div class="admin-container">
      <header class="admin-top">
        <div>
          <h1 class="display-title">Manage Products</h1>
          <p class="subtitle">Edit prices and photos for the shop catalogue</p>
        </div>
        <button type="button" id="logout" class="btn btn-outline btn-pill">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          Log out
        </button>
      </header>

      <div class="toolbar">
        <input type="search" id="search" class="search-input" placeholder="Search products…" aria-label="Search products">
        <button type="button" id="save-all" class="btn btn-dark">Save changes</button>
      </div>

      <div class="meta-row">
        <span id="product-count" class="meta-text">0 products</span>
        <span id="dirty-count" class="meta-dirty" hidden>• Unsaved changes</span>
        <span id="last-updated" class="meta-text"></span>
      </div>

      <p id="status-msg" class="status-banner" hidden></p>

      <div id="category-pills" class="category-pills" role="tablist" aria-label="Filter by category"></div>

      <div id="products-grid" class="products-grid"></div>
    </div>
  </div>

  <script src="/admin/admin.js"></script>
</body>
</html>
